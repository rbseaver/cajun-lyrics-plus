services:
  cajunlyrics-plus:
    build:
      context: .
      dockerfile: CajunLyrics.Api/Dockerfile
    image: cajunlyrics-plus:local
    container_name: cajunlyrics-plus
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
