stages:
  - test
  - release-check

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/
    - CajunLyrics.Web/node_modules/

frontend_tests:
  stage: test
  image: node:22
  script:
    - cd CajunLyrics.Web
    - npm ci
    - npm test -- --run --coverage
  artifacts:
    when: always
    paths:
      - CajunLyrics.Web/coverage/
    expire_in: 7 days

unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore CajunLyrics.slnx
    - dotnet test CajunLyrics.Tests.Unit/CajunLyrics.Tests.Unit.csproj --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit-tests.trx" --results-directory test-results
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 7 days

# Hermetic endpoint tests against the local WireMock stub (UpstreamFixtures/):
# no network, no rate limit. The live-upstream canary is excluded here — it is
# the CD/deploy-time tier (Category=Live).
integration_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore CajunLyrics.slnx
    - dotnet test CajunLyrics.Tests.Integration/CajunLyrics.Tests.Integration.csproj --filter "TestCategory!=Live" --logger "trx;LogFileName=integration-tests.trx" --results-directory test-results
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 7 days

# Builds the image so Dockerfile breakage shows up as a red pipeline.
# Build only — no push until a registry is chosen.
image_build:
  stage: test
  image: docker:29
  # No layer cache in DinD, so a cold run is base-image pulls + npm ci +
  # restore + publish — about 2-3 minutes. Longer than that is a red flag.
  timeout: 5m
  services:
    # The inner daemon defaults to MTU 1500 while the runner network caps at
    # 1360; bigger packets to api.nuget.org (behind Microsoft Front Door) are
    # then dropped silently and dotnet restore hangs until it times out.
    # See https://support.gitlab.com/hc/en-us/articles/27528955698972
    - name: docker:29-dind
      command: ["--mtu=1360"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: {}
  script:
    - docker build --file CajunLyrics.Api/Dockerfile --tag cajunlyrics-plus:ci .

release_gate:
  stage: release-check
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - frontend_tests
    - unit_tests
    - integration_tests
    - image_build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Release tag ${CI_COMMIT_TAG} passed the test and image build gates."
